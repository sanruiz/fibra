name: SOMA CI - Quality & Tests

on:
  push:
    branches:
      - main
      - develop
      - 'week-*'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  NODE_VERSION: '18'
  PHP_VERSION: '8.1'
  THEME_PATH: 'wp-content/themes/soma'

jobs:
  # Job 1: Code Quality Analysis (STRICT) - Runs in parallel
  code-quality:
    name: 🔍 Code Quality Analysis (STRICT)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, mysql
          coverage: none

      - name: 📦 Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.THEME_PATH }}/vendor
          key: composer-${{ hashFiles(format('{0}/composer.lock', env.THEME_PATH)) }}

      - name: 🎼 Install Composer dependencies
        run: |
          cd ${{ env.THEME_PATH }}
          composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: 🔧 PHP Code Beautifier - Auto-fix Minor Issues
        run: |
          cd ${{ env.THEME_PATH }}
          if command -v ./vendor/bin/phpcbf &> /dev/null; then
            echo "🔧 Running PHP Code Beautifier to auto-fix minor coding standard issues..."
            
            set +e
            ./vendor/bin/phpcbf || true
            PHPCBF_EXIT_CODE=$?
            set -e
            
            if [ $PHPCBF_EXIT_CODE -eq 0 ]; then
              echo "✅ PHPCBF: No fixable issues found"
            elif [ $PHPCBF_EXIT_CODE -eq 1 ]; then
              echo "🔧 PHPCBF: Auto-fixed some coding standard issues"
            else
              echo "⚠️ PHPCBF: Completed with exit code $PHPCBF_EXIT_CODE"
            fi
          else
            echo "⚠️ PHPCBF not available, skipping auto-fix"
          fi

      - name: 🔍 PHP CodeSniffer - WordPress Coding Standards (Required)
        run: |
          cd ${{ env.THEME_PATH }}
          if command -v ./vendor/bin/phpcs &> /dev/null; then
            echo "🔍 Running PHP CodeSniffer with WordPress coding standards..."
            echo "📋 Analyzing files..."
            
            set +e
            PHPCS_OUTPUT=$(./vendor/bin/phpcs --report=summary --colors 2>&1)
            PHPCS_EXIT_CODE=$?
            set -e
            
            echo "$PHPCS_OUTPUT"
            
            # Check if there are actual ERRORS (not just warnings)
            ERROR_COUNT=$(echo "$PHPCS_OUTPUT" | grep -o "ERRORS" | head -1 || true)
            TOTAL_ERRORS=$(echo "$PHPCS_OUTPUT" | grep "A TOTAL OF" | grep -oP '\d+(?= ERROR)' || echo "0")
            
            if [ $PHPCS_EXIT_CODE -eq 0 ]; then
              echo "✅ PHPCS: No coding standard violations found"
            elif [ "$TOTAL_ERRORS" -gt 0 ]; then
              echo "❌ PHPCS: Found $TOTAL_ERRORS error(s) - deployment blocked!"
              echo "💡 Fix the errors above or run 'composer phpcbf' to auto-fix issues"
              exit 1
            elif [ $PHPCS_EXIT_CODE -eq 1 ] || [ $PHPCS_EXIT_CODE -eq 2 ]; then
              echo "⚠️ PHPCS: Warnings found but no errors - allowing deployment"
              echo "💡 Consider fixing warnings with 'composer phpcbf' for better code quality"
            else
              echo "❌ PHPCS: Unexpected exit code $PHPCS_EXIT_CODE - deployment blocked!"
              exit 1
            fi
          else
            echo "⚠️ PHPCS not available - skipping (consider adding to composer.json)"
          fi

      - name: 🔍 PHPStan - Static Analysis Level 6+ (Required)
        run: |
          cd ${{ env.THEME_PATH }}
          if command -v ./vendor/bin/phpstan &> /dev/null && [ -f "phpstan.neon" ]; then
            echo "🔍 Running PHPStan static analysis Level 6+..."
            echo "📋 Analyzing code for type errors and bugs..."
            
            set +e
            ./vendor/bin/phpstan analyse --error-format=table --no-progress --memory-limit=1G
            PHPSTAN_EXIT_CODE=$?
            set -e
            
            if [ $PHPSTAN_EXIT_CODE -eq 0 ]; then
              echo "✅ PHPStan: No errors found - code analysis passed"
            else
              echo "❌ PHPStan: Static analysis errors found - deployment blocked!"
              echo "💡 Fix the type errors and bugs listed above"
              exit 1
            fi
          else
            echo "⚠️ PHPStan not available or phpstan.neon not found"
          fi

  # Job 2: PHP Unit & Integration Tests - Runs in parallel
  php-tests:
    name: 🧪 PHP Unit & Integration Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, mysql
          coverage: xdebug

      - name: 📦 Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.THEME_PATH }}/vendor
          key: composer-${{ hashFiles(format('{0}/composer.lock', env.THEME_PATH)) }}

      - name: 🎼 Install Composer dependencies
        run: |
          cd ${{ env.THEME_PATH }}
          composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: 📦 Install SVN
        run: |
          sudo apt-get update
          sudo apt-get install -y subversion

      - name: 🏗️ Setup WordPress Test Environment
        run: |
          cd ${{ env.THEME_PATH }}
          if [ -f "tests/bin/install-wp-tests.sh" ]; then
            echo "🏗️ Installing WordPress test suite..."
            bash tests/bin/install-wp-tests.sh wordpress_test root password 127.0.0.1 latest
            echo "✅ WordPress test environment installed successfully"
          else
            echo "⚠️ WordPress test installation script not found - skipping"
          fi
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
          WP_CORE_DIR: /tmp/wordpress/

      - name: 🔗 Setup Theme Symlink for Tests
        run: |
          if [ -d "/tmp/wordpress" ]; then
            echo "🔗 Creating symlink for theme in test WordPress installation..."
            mkdir -p /tmp/wordpress/wp-content/themes/
            rm -rf /tmp/wordpress/wp-content/themes/soma
            ln -sf "$(pwd)/${{ env.THEME_PATH }}" /tmp/wordpress/wp-content/themes/soma
            echo "✅ Theme symlink created"
          fi

      - name: 🧪 Run PHPUnit Tests (108 tests expected)
        run: |
          cd ${{ env.THEME_PATH }}
          if command -v ./vendor/bin/phpunit &> /dev/null && [ -f "phpunit.xml" ]; then
            echo "🧪 Running PHPUnit tests with phpunit.xml configuration..."
            echo "📋 Expected: 108 tests, 355 assertions"
            
            set +e
            ./vendor/bin/phpunit --verbose --coverage-clover=coverage.xml
            PHPUNIT_EXIT_CODE=$?
            set -e
            
            if [ $PHPUNIT_EXIT_CODE -eq 0 ]; then
              echo "✅ PHPUnit: All tests passed successfully"
            else
              echo "❌ PHPUnit: Some tests failed - check output above"
              echo "💡 Check test output above for details"
              exit 1
            fi
          else
            echo "⚠️ PHPUnit not available or phpunit.xml not found - skipping"
          fi
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
          WP_CORE_DIR: /tmp/wordpress/

      - name: 📊 Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ${{ env.THEME_PATH }}/coverage.xml
          flags: phpunit
          name: soma-phpunit-coverage
        continue-on-error: true

  # Job 3: Frontend Build Validation - Runs in parallel
  frontend-build:
    name: 🎨 Frontend Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Cache Node modules
        uses: actions/cache@v4
        with:
          path: ${{ env.THEME_PATH }}/node_modules
          key: npm-${{ hashFiles(format('{0}/package-lock.json', env.THEME_PATH)) }}

      - name: 📦 Install dependencies
        run: |
          cd ${{ env.THEME_PATH }}
          npm install

      - name: 🏗️ Build production assets
        run: |
          cd ${{ env.THEME_PATH }}
          echo "🏗️ Building production assets with Webpack..."
          npm run prod
          echo "✅ Assets built successfully"

      - name: ✅ Verify build outputs
        run: |
          cd ${{ env.THEME_PATH }}
          if [ -f "css/main.bundle.css" ] && [ -f "js/main.bundle.js" ]; then
            echo "✅ Build outputs verified:"
            ls -lh css/main.bundle.css js/main.bundle.js
          else
            echo "❌ Build outputs not found!"
            exit 1
          fi

  # Summary Job - Reports overall status
  ci-summary:
    name: 📊 CI Summary
    runs-on: ubuntu-latest
    needs: [code-quality, php-tests, frontend-build]
    if: always()

    steps:
      - name: 📊 Generate CI Summary
        run: |
          echo "## 🎯 CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job Results" >> $GITHUB_STEP_SUMMARY
          echo "- Code Quality: ${{ needs.code-quality.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- PHP Tests: ${{ needs.php-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend Build: ${{ needs.frontend-build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.code-quality.result }}" == "success" ] && \
             [ "${{ needs.php-tests.result }}" == "success" ] && \
             [ "${{ needs.frontend-build.result }}" == "success" ]; then
            echo "✅ **All checks passed!** Ready to merge or release." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Some checks failed.** Review errors above." >> $GITHUB_STEP_SUMMARY
          fi
