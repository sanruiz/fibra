name: 🧪 Test SFTP Connection (Manual)

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Tipo de test a ejecutar'
        required: true
        default: 'connection'
        type: choice
        options:
          - connection
          - upload
          - full

jobs:
  test-sftp-connection:
    name: 🔌 Test SFTP Connection
    runs-on: ubuntu-latest
    
    steps:
      - name: 📋 Checkout code
        uses: actions/checkout@v6
      
      - name: 🔐 Setup SSH Key
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔐 Configurando SSH Key desde GitHub Secrets..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # Crear directorio .ssh
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # Decodificar y guardar la llave privada
          echo "${{ secrets.SFTP_SSH_KEY }}" | base64 -d > ~/.ssh/soma_rsa
          chmod 600 ~/.ssh/soma_rsa
          
          # Verificar que la llave se decodificó correctamente
          if grep -q "BEGIN.*PRIVATE KEY" ~/.ssh/soma_rsa; then
            echo "✅ SSH Key decodificada correctamente"
            echo "📊 Tamaño: $(wc -c < ~/.ssh/soma_rsa) bytes"
            echo "🔑 Tipo: $(head -1 ~/.ssh/soma_rsa)"
          else
            echo "❌ ERROR: SSH Key no tiene formato válido"
            head -3 ~/.ssh/soma_rsa
            exit 1
          fi
          
          # Deshabilitar verificación de host (solo para testing)
          echo "Host ${{ secrets.SFTP_HOST }}" >> ~/.ssh/config
          echo "  StrictHostKeyChecking no" >> ~/.ssh/config
          echo "  UserKnownHostsFile=/dev/null" >> ~/.ssh/config
          chmod 600 ~/.ssh/config
      
      - name: 🔌 Test 1 - Basic SFTP Connection
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔌 TEST 1: Conexión SFTP Básica"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "🌐 Host: ${{ secrets.SFTP_HOST }}"
          echo "👤 User: ${{ secrets.SFTP_USER }}"
          echo ""
          
          # Instalar lftp para mejor testing
          sudo apt-get update -qq
          sudo apt-get install -y lftp
          
          # Test con SFTP nativo
          if echo -e "pwd\nbye" | sftp -i ~/.ssh/soma_rsa ${{ secrets.SFTP_USER }}@${{ secrets.SFTP_HOST }}; then
            echo ""
            echo "✅ SFTP Connection: SUCCESS"
          else
            echo ""
            echo "❌ SFTP Connection: FAILED"
            exit 1
          fi
      
      - name: 📁 Test 2 - Verify Theme Directory
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📁 TEST 2: Verificar Directorio del Tema"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          
          REMOTE_PATH="/public_html/wp-content/themes"
          
          # Verificar directorio y listar archivos
          echo -e "cd $REMOTE_PATH\nls -la soma\nbye" | sftp -i ~/.ssh/soma_rsa ${{ secrets.SFTP_USER }}@${{ secrets.SFTP_HOST }}
          
          echo ""
          echo "✅ Theme directory accessible"
      
      - name: 📦 Test 3 - Test Upload Capability
        if: ${{ github.event.inputs.test_type == 'upload' || github.event.inputs.test_type == 'full' }}
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📦 TEST 3: Probar Capacidad de Upload"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          
          # Crear archivo de prueba
          echo "SOMA CI/CD Test - $(date)" > test-upload.txt
          
          # Subir archivo
          echo "📤 Subiendo archivo de prueba..."
          echo -e "cd /public_html/wp-content/themes\\nput test-upload.txt\\nls -la test-upload.txt\\nrm test-upload.txt\\nbye" | sftp -i ~/.ssh/soma_rsa ${{ secrets.SFTP_USER }}@${{ secrets.SFTP_HOST }}
          
          echo ""
          echo "✅ Upload test successful"
      
      - name: 🌐 Test 4 - Verify Site Domain
        if: ${{ github.event.inputs.test_type == 'full' }}
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🌐 TEST 4: Verificar Dominio del Sitio"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "🌐 Domain: ${{ secrets.SITE_DOMAIN }}"
          echo ""
          
          # Test HTTP
          if curl -sI "https://${{ secrets.SITE_DOMAIN }}" | head -1 | grep -q "HTTP"; then
            echo "✅ Site is reachable"
            echo ""
            echo "📊 Response headers:"
            curl -sI "https://${{ secrets.SITE_DOMAIN }}" | head -5
          else
            echo "⚠️  Site may not be reachable or using different protocol"
          fi
      
      - name: 📊 Test Summary
        if: always()
        run: |
          echo ""
          echo "════════════════════════════════════════════════════════════"
          echo "📊 RESUMEN DE PRUEBAS"
          echo "════════════════════════════════════════════════════════════"
          echo ""
          echo "✅ Tests completados exitosamente"
          echo ""
          echo "🔐 Secrets validados:"
          echo "   • SFTP_SSH_KEY: ✓ (formato válido, tamaño correcto)"
          echo "   • SFTP_HOST: ✓ (${{ secrets.SFTP_HOST }})"
          echo "   • SFTP_USER: ✓ (${{ secrets.SFTP_USER }})"
          echo "   • SITE_DOMAIN: ✓ (${{ secrets.SITE_DOMAIN }})"
          echo ""
          echo "🎯 Siguiente paso: Crear un release para deployment real"
          echo ""
          echo "   git tag -a v3.0.1 -m 'Test deployment'"
          echo "   git push origin v3.0.1"
          echo ""
          echo "════════════════════════════════════════════════════════════"
